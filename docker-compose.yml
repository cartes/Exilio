services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-exilio}
      POSTGRES_USER: ${DB_USERNAME:-exilio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-exilio} -d ${DB_DATABASE:-exilio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Buscador general para los scouts de investigación (Fase 6). Solo accesible desde localhost.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local}
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PORT:-8888}/
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  postgres_data:
