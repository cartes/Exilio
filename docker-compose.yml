services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-exilio}
      POSTGRES_USER: ${DB_USERNAME:-exilio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-exilio} -d ${DB_DATABASE:-exilio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
